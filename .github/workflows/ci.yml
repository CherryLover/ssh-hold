name: CI

on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:

jobs:
  test:
    name: test (${{ matrix.os }})
    runs-on: ${{ matrix.os }}
    strategy:
      fail-fast: false
      matrix:
        # macOS 上是 bash 3.2，Linux 上是 bash 5.x，两边都要过。
        os: [ubuntu-latest, macos-latest]
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'

      - name: 安装 shellcheck
        if: runner.os == 'Linux'
        run: sudo apt-get update && sudo apt-get install -y shellcheck

      - run: make lint

      - run: make test

      - uses: astral-sh/setup-uv@v5

      - name: 真实 SSH 握手测试（本地回环）
        run: make test-wire

      - name: 打包并验证发布产物
        run: make dist

      - name: 装到临时前缀再跑一遍
        run: |
          set -euo pipefail
          version="$(make version)"
          tar -xzf "dist/ssh-hold-${version}.tar.gz" -C "$RUNNER_TEMP"
          "$RUNNER_TEMP/ssh-hold-${version}/install.sh" --prefix "$RUNNER_TEMP/opt"
          "$RUNNER_TEMP/opt/bin/ssh-hold" version
          "$RUNNER_TEMP/opt/bin/ssh-hold" list
          test -f "$RUNNER_TEMP/opt/lib/ssh-hold/paste.py"
          test -f "$RUNNER_TEMP/opt/share/man/man1/ssh-hold.1"

      - name: 联网安装那条路径（拿本地包演一遍）
        run: |
          set -euo pipefail
          version="$(make version)"
          SSH_HOLD_RELEASE_URL="file://$PWD/dist/ssh-hold-${version}.tar.gz" \
            ./install.sh --prefix "$RUNNER_TEMP/opt-remote"
          # 先跑完再比对。直接管给 grep -q 的话它一匹配上就关管道，
          # ssh-hold 后面的 echo 撞上 EPIPE，pipefail 下会把整步判成失败。
          out="$("$RUNNER_TEMP/opt-remote/bin/ssh-hold" version)"
          echo "$out"
          grep -q "ssh-hold ${version}" <<<"$out"

      - name: 单文件版自检
        run: |
          set -euo pipefail
          # 换个 HOME，确认它靠内嵌副本工作，而不是摸到别处装好的 lib。
          export HOME="$RUNNER_TEMP/fakehome"
          mkdir -p "$HOME"
          cp dist/ssh-hold "$RUNNER_TEMP/ssh-hold-standalone"
          "$RUNNER_TEMP/ssh-hold-standalone" version
          test -f "$HOME/.cache/ssh-hold"/lib-*/paste.py
